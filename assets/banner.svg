<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Dan Sambold</title>
<desc id="d">Marine scientist and research engineer. A shark swims past a pulsing radio tag.</desc>
<style>
.ring{fill:none;stroke:#f2a93b;stroke-width:2;transform-origin:1020px 150px;animation:ping 3.3s ease-out infinite;opacity:0}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(9);opacity:0}}
.swim{animation:swim 14s ease-in-out infinite alternate}
@keyframes swim{from{transform:translate(640px,118px)}to{transform:translate(700px,126px)}}
.drift{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-300px)}}
@media (prefers-reduced-motion:reduce){.ring,.swim,.drift{animation:none}.ring{opacity:.35}}
</style>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123a55"/><stop offset=".55" stop-color="#0b1f33"/><stop offset="1" stop-color="#071522"/></linearGradient>
<radialGradient id="sun" cx=".78" cy="-.1" r=".8"><stop offset="0" stop-color="#2bb3a9" stop-opacity=".35"/><stop offset="1" stop-color="#2bb3a9" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="14" fill="url(#sea)"/>
<rect width="1200" height="300" rx="14" fill="url(#sun)"/>
<path d="M-20,210 C200,192 420,232 640,210 S1060,190 1240,216" fill="none" stroke="#2bb3a9" stroke-opacity="0.16" stroke-width="1"/><path d="M-20,234 C200,216 420,256 640,234 S1060,214 1240,240" fill="none" stroke="#2bb3a9" stroke-opacity="0.12" stroke-width="1"/><path d="M-20,258 C200,240 420,280 640,258 S1060,238 1240,264" fill="none" stroke="#2bb3a9" stroke-opacity="0.09" stroke-width="1"/><path d="M-20,282 C200,264 420,304 640,282 S1060,262 1240,288" fill="none" stroke="#2bb3a9" stroke-opacity="0.06" stroke-width="1"/><path d="M-20,186 C200,168 420,208 640,186 S1060,166 1240,192" fill="none" stroke="#2bb3a9" stroke-opacity="0.08" stroke-width="1"/>
<g class="drift" fill="#e6f2f1" fill-opacity=".35">
<circle cx="520" cy="280" r="1.2"/><circle cx="610" cy="330" r="1"/><circle cx="880" cy="300" r="1.5"/><circle cx="960" cy="420" r="1"/><circle cx="1110" cy="360" r="1.3"/><circle cx="760" cy="460" r="1"/><circle cx="1160" cy="520" r="1.1"/><circle cx="450" cy="480" r="1"/><circle cx="1050" cy="560" r="1.4"/><circle cx="820" cy="590" r="1"/>
</g>
<g class="swim"><g transform="scale(.9)"><path d="M0,42 C18,30 58,22 112,21 L150,19 L168,-20 L196,17 L262,24 L300,31 L338,-8 L352,-6 L334,38 L356,78 L342,80 L300,47 L262,52 L204,58 L160,60 L126,94 L112,92 L118,62 L70,62 C36,60 12,54 0,42 Z" fill="#2a4a63" stroke="#9fb6c3" stroke-opacity=".5" stroke-width="1.5"/>
<path d="M14,44 C50,54 110,58 160,58" fill="none" stroke="#e6f2f1" stroke-opacity=".35" stroke-width="2"/>
<circle cx="30" cy="36" r="2.4" fill="#e6f2f1" fill-opacity=".7"/></g></g>
<circle cx="1020" cy="150" r="14" class="ring" style="animation-delay:0s"/><circle cx="1020" cy="150" r="14" class="ring" style="animation-delay:1.1s"/><circle cx="1020" cy="150" r="14" class="ring" style="animation-delay:2.2s"/>
<circle cx="1020" cy="150" r="5" fill="#f2a93b"/>
<text x="1020" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#f2a93b" fill-opacity=".85">151.2 MHz</text>
<text x="64" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#e6f2f1">Dan Sambold</text>
<text x="66" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#2bb3a9">Marine scientist and research engineer</text>
<text x="66" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#9fb6c3">Computer vision, radio telemetry and field instruments</text>
<text x="66" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#9fb6c3">for sharks and the coastal ocean.</text>
</svg>