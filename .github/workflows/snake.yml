name: Contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2bb3a9&color_dots=#ebedf0,#b8e3df,#7ccbc3,#2bb3a9,#1b6f6b
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2a93b&color_dots=#161b22,#0e3b3a,#1b6f6b,#2bb3a9,#7ce0d6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
