name: Propose a collaboration
description: "Work together on one of the projects: data, field sites, expertise or code."
title: "[Collaborate] "
labels: ["collaboration"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. A few short answers help me see quickly where we fit.
        
        Issues are public. Please do not post an email address, phone number or exact site coordinates here. I will reply on the issue. To reach me privately instead, email daniel.sambold@gmail.com.
  - type: input
    id: who
    attributes:
      label: "Who are you?"
      description: "Name, and your lab, organisation or role."
      placeholder: "Jane Doe, kelp lab at Somewhere University"
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: "Which project?"
      options:
        - "shark-pose-3d"
        - "Shark Scar Annotator"
        - "RelayStation"
        - "anchor"
        - "TerraMesh"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Which open problem, or what idea?"
      description: "Each project lists what needs work at the top of its skeleton README."
    validations:
      required: true
  - type: checkboxes
    id: bring
    attributes:
      label: "What could you bring?"
      options:
        - label: "Data"
        - label: "A field site or access"
        - label: "Expertise or advice"
        - label: "Code or engineering time"
        - label: "Equipment or hardware"
        - label: "Funding or a grant idea"
        - label: "Students or a class"
  - type: dropdown
    id: when
    attributes:
      label: "Timeline"
      options:
        - "Just exploring"
        - "In the next few months"
        - "This year"
        - "Tied to a deadline (say which below)"
    validations:
      required: false
  - type: input
    id: links
    attributes:
      label: "Links (optional)"
      description: "A paper, lab page or repo that shows your work."
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: "Before you submit"
      options:
        - label: "I understand this issue is public and I have not posted private contact details or exact site locations."
          required: true
